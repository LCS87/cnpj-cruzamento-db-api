[pytest]
; -p no:libtmux: o plugin embutido do pacote libtmux (dependência alheia ao
; projeto) é incompatível com pytest>=8 ("Marks cannot be applied to fixtures")
; e quebraria a coleta. Desativá-lo aqui garante que `python -m pytest` puro
; funcione em qualquer ambiente onde libtmux esteja instalado.
addopts = -p no:libtmux -q --strict-markers
testpaths = tests
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
